name: CI / Static Analysis & Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Node.js 22 CI on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Runtime & Compatibility
        run: node scripts/check-runtime.mjs

      - name: Setup Database & Generate Prisma Client
        run: node scripts/setup.mjs

      - name: Run Security & Unit Tests
        run: npm run test

      - name: Typecheck
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build
